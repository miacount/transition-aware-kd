defaults:
  - teacher_finetune_ted3
  - _self_

source_model: stt_en_conformer_ctc_small
output_nemo: nemo_experiments/teacher-chime3-adapted-s1/best-teacher-chime3-adapted-s1.nemo
seed: 1

train_ds:
  manifest_filepath: data/chime3_train_enhanced.json
  sample_rate: 16000
  batch_size: 16
  shuffle: true
  num_workers: 8
  pin_memory: true
  use_start_end_token: false
  trim_silence: false
  max_duration: 21.0
  min_duration: 0.1

validation_ds:
  manifest_filepath: data/chime3_dev_enhanced.json
  sample_rate: 16000
  batch_size: 32
  shuffle: false
  num_workers: 8
  pin_memory: true
  use_start_end_token: false

test_ds:
  manifest_filepath: data/chime3_eval_enhanced.json
  sample_rate: 16000
  batch_size: 32
  shuffle: false
  num_workers: 8
  pin_memory: true
  use_start_end_token: false

trainer:
  max_epochs: 10
  accumulate_grad_batches: 4

exp_manager:
  name: teacher-chime3-adapted-s1
  wandb_logger_kwargs:
    project: transition-aware-kd-chime3
    name: teacher-chime3-adapted-s1
  checkpoint_callback_params:
    filename: teacher-chime3-adapted-s1--{val_wer:.4f}-{epoch}
