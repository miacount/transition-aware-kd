defaults:
  - teacher_finetune_chime3
  - _self_
source_model: stt_en_citrinet_512
output_nemo: nemo_experiments/teacher-citrinet512-chime3-adapted-s1/best-teacher-citrinet512-chime3-adapted-s1.nemo
optim:
  name: adamw
  lr: 1.0e-4
  betas: [0.9, 0.98]
  weight_decay: 1.0e-3
  sched: {name: CosineAnnealing, warmup_steps: 300, min_lr: 1.0e-6}
exp_manager:
  name: teacher-citrinet512-chime3-adapted-s1
  wandb_logger_kwargs:
    project: transition-aware-kd-citrinet
    name: teacher-citrinet512-chime3-adapted-s1
  checkpoint_callback_params:
    filename: teacher-citrinet512-chime3-adapted-s1--{val_wer:.4f}-{epoch}
