# TED-LIUM 100h variant of student_base. ONLY diffs vs base: val/test manifests
# (tedlium_dev/test) and run/project names. train_ds is overridden by train.sh --manifest.
name: "student-conformer-144x8-1024-ted"

model:
  sample_rate: 16000
  log_prediction: false
  ctc_reduction: "mean_batch"
  seed: 1               # RNG seed for reproducible ablation deltas (data/init/augment)

  kd_mode: "none"       # none | trans | logit | token_avg | combined | guided | delayed_logit | self_kd | aligned_token | span_kd
  kd_weight: 0.0
  token_avg_kd_weight: 0.0
  transition_kd_weight: 0.0
  kd_lambda: null       # paper formula: L=(1-λ)*L_CTC + λ*L_KD; null→legacy L_CTC+kd_weight*L_KD
  logit_kd_temperature: 2.0
  logit_kd_blank_mode: "none"   # none | elimination | symmetric | trim | threshold | random
  logit_kd_blank_n: 1           # symmetric: extend n frames each side of non-blank
  logit_kd_blank_threshold: 0.9 # threshold: select frame if p(blank) < threshold
  logit_kd_blank_beta: 0.5      # random: fraction of blank frames to include
  logit_kd_occ_weight: 0.0     # KL decomp: λ_occ for binary blank/non-blank KL at d=1 blank frames
  logit_kd_res_weight: 0.0     # KL decomp: λ_res for blank-normalised conditional KL at d=1 blank frames
  logit_kd_tab_size: 2          # delayed_logit: TAB window [s_t, s_t+tab_size]
  logit_kd_cross_pool: false    # logit KD, cross frame-rate: average BOTH teacher frames per student frame (spike-preserving)
  span_kd_gate_threshold: 0.3   # span_kd: skip token occurrences below this support/teacher overlap gate
  span_kd_dual: false           # span_kd: pool student with its OWN de-peaked FB gamma (on-the-fly, detached)
  span_kd_student_delta: 6.0    # span_kd_dual: blank penalty (nats) for the student-side gamma
  span_kd_emit_beta: 1.0        # span_kd: weight on emission term -log m_u; beta=1 == current loss, beta=0 = content-only
  span_kd_uniform_target: false # span_kd: flatten teacher top-k to uniform (isolate relative-weight dark knowledge)
  kd_start_step: 0              # CTC-only warm-up: KD disabled until this global_step
  skd_split_layer: 4            # self_kd: encoder layer to attach intermediate CTC head
  skd_alpha: 0.5                # self_kd: (1-α)*CTC_full + α*(CTC_inter + SKD)
  sr_ctc_weight: 0.0            # SR-CTC smooth regularization weight beta (Yao 2025 A.1); 0=off
  label_prior_ctc_alpha: 0.0    # label-prior CTC regularization strength (Huang 2024); 0=off
  label_prior_momentum: 0.99    # EMA momentum for the running label prior estimate
  cr_ctc_weight: 0.2            # cr_ctc: consistency loss weight alpha (Yao et al. 2025)
  cr_ctc_time_mask_factor: 2.5  # cr_ctc: time-masking regions/width multiplier vs. base SpecAugment
  cr_ctc_warm_step: 2000        # cr_ctc: steps to linearly ramp cr loss weight 0 -> cr_ctc_weight

  train_ds:
    manifest_filepath: "data/train_clean_100.json"
    sample_rate: 16000
    batch_size: 32
    shuffle: true
    num_workers: 8
    pin_memory: true

  validation_ds:
    manifest_filepath: "data/tedlium_dev.json"
    sample_rate: 16000
    batch_size: 32
    shuffle: false
    num_workers: 8
    pin_memory: true

  test_ds:
    - name: "ted_dev"
      manifest_filepath: "data/tedlium_dev.json"
      sample_rate: 16000
      batch_size: 32
      shuffle: false
      num_workers: 8
      pin_memory: true
    - name: "ted_test"
      manifest_filepath: "data/tedlium_test.json"
      sample_rate: 16000
      batch_size: 32
      shuffle: false
      num_workers: 8
      pin_memory: true

  tokenizer:
    dir: "tokenizer_1024"
    type: "bpe"

  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: 16000
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    features: 80
    n_fft: 512
    pad_to: 0

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: 80
    n_layers: 8
    d_model: 144
    subsampling: striding
    subsampling_factor: 4
    subsampling_conv_channels: 144
    ff_expansion_factor: 4
    self_attention_model: rel_pos
    n_heads: 4
    att_context_size: [-1, -1]
    conv_kernel_size: 31
    dropout: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1

  decoder:
    _target_: nemo.collections.asr.modules.ConvASRDecoder
    feat_in: 144
    num_classes: -1
    vocabulary: []

  optim:
    name: adamw
    lr: 2.0  # Noam scaled: effective peak = lr × d_model^-0.5 × warmup^-0.5 ≈ 1.67e-3
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    sched:
      name: NoamAnnealing
      d_model: 144
      # warmup_steps counts optimizer steps, which depend on #utterances/epoch.
      # LS train-clean-100 = 28.5k utts → 2500 steps ≈ 5.6 warmup epochs. TED 100h
      # has ~69k (shorter) utts → 2.4x more steps/epoch, so 2500 steps is only ~2.3
      # epochs and the from-scratch CTC collapses to all-blank before LR ramps.
      # Rescaled to match LS's ~5.6 warmup epochs on TED's utterance count (verified:
      # escapes the blank basin at epoch ~4, val_wer 0.99→0.41 by epoch 19).
      warmup_steps: 6000
      min_lr: 1e-5

trainer:
  devices: 1
  accelerator: gpu
  max_epochs: 100
  precision: bf16-mixed
  log_every_n_steps: 50
  val_check_interval: 1.0
  enable_checkpointing: false
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2  # effective batch = 32 × 2 = 64

exp_manager:
  exp_dir: "nemo_experiments"
  name: "student-conformer-144x8-1024"
  create_wandb_logger: true
  wandb_logger_kwargs:
    project: "transition-aware-kd-ted"
    name: "student-conformer-144x8-1024"
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 3
    save_last: true
  resume_if_exists: false
  resume_ignore_no_checkpoint: true
