    feat_in: 360
    num_classes: -1
    vocabulary: []
  optim:
    name: novograd
    lr: 0.05
    betas:
    - 0.8
    - 0.25
    weight_decay: 0.001
    sched:
      name: CosineAnnealing
      warmup_steps: 300
      min_lr: 1.0e-05
trainer:
  devices: 1
  accelerator: gpu
  max_epochs: 100
  precision: bf16-mixed
  log_every_n_steps: 50
  val_check_interval: 1.0
  enable_checkpointing: false
  gradient_clip_val: 1.0
  accumulate_grad_batches: 2
exp_manager:
  exp_dir: nemo_experiments
  name: student-citrinet-256-1024-chime3
  create_wandb_logger: true
  wandb_logger_kwargs:
    project: transition-aware-kd-chime3
    name: student-citrinet-256-1024-chime3
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: val_wer
    mode: min
    save_top_k: 3
    save_last: true
  resume_if_exists: false
  resume_ignore_no_checkpoint: true
