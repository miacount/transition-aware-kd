<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Occurrence-aware AT-DKD overview</title>
  <desc id="dsc">A repeated-token example shows blank-suppressed occurrence localization, posterior weighted pooling, and BTKD plus NTKD.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#3E4A56"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2E78B7"/>
    </marker>
    <style>
      text{font-family:'Times New Roman','Liberation Serif',serif;fill:#1F2933}
      .h{font-size:25px;font-weight:700}.b{font-size:21px;font-weight:700}.n{font-size:19px}.s{font-size:16px}
      .m{font-family:'STIX Two Math','Cambria Math','Times New Roman',serif;font-size:20px;font-style:italic}
      .panel{fill:#FFF;stroke:#B7C0C9;stroke-width:2}.sep{stroke:#C4CBD2;stroke-width:2;stroke-dasharray:6 7}
      .flow{fill:none;stroke:#3E4A56;stroke-width:2.7;marker-end:url(#arr)}
      .blueflow{fill:none;stroke:#2E78B7;stroke-width:3;marker-end:url(#arrB)}
    </style>
  </defs>
  <rect width="1600" height="430" fill="#FFF"/>
  <line class="sep" x1="522" y1="18" x2="522" y2="410"/>
  <line class="sep" x1="1065" y1="18" x2="1065" y2="410"/>

  <!-- 1. occurrence localization -->
  <text class="h" x="22" y="34">1  Locate one occurrence</text>
  <text class="n" x="28" y="70">Transcript</text>
  <g transform="translate(132,49)">
    <rect x="0" y="0" width="72" height="34" rx="8" fill="#E9F2F9" stroke="#2E78B7" stroke-width="1.7"/>
    <rect x="82" y="0" width="72" height="34" rx="8" fill="#F0F2F4" stroke="#7B8792" stroke-width="1.7"/>
    <rect x="164" y="0" width="72" height="34" rx="8" fill="#FFF3D8" stroke="#D48A00" stroke-width="2.7"/>
    <text class="b" x="36" y="24" text-anchor="middle" fill="#2E78B7">A₁</text>
    <text class="b" x="118" y="24" text-anchor="middle">B</text>
    <text class="b" x="200" y="24" text-anchor="middle" fill="#B56E00">A₂</text>
  </g>
  <path d="M332 89V106" class="blueflow"/>

  <text class="b" x="28" y="126">Teacher posterior</text>
  <text class="m" x="206" y="126">p<tspan baseline-shift="super" font-size="13">T</tspan><tspan baseline-shift="sub" font-size="13">t</tspan></text>
  <g transform="translate(58,140)">
    <text class="n" x="-13" y="27" text-anchor="end" fill="#2E78B7">A</text>
    <text class="n" x="-13" y="67" text-anchor="end" fill="#697681">B</text>
    <text class="n" x="-13" y="107" text-anchor="end" fill="#697681">∅</text>
    <rect x="0" y="0" width="400" height="120" rx="7" fill="#F8FAFB" stroke="#98A5B1" stroke-width="1.7"/>
    <!-- A: two spikes, same class but distinct occurrences -->
    <g stroke="#FFF" stroke-width="2">
      <rect x="1" y="1" width="49" height="39" fill="#DCEAF5"/><rect x="50" y="1" width="50" height="39" fill="#2E78B7"/>
      <rect x="100" y="1" width="50" height="39" fill="#D8E8F3"/><rect x="150" y="1" width="50" height="39" fill="#ECF3F8"/>
      <rect x="200" y="1" width="50" height="39" fill="#E7F0F7"/><rect x="250" y="1" width="50" height="39" fill="#BDD7E9"/>
      <rect x="300" y="1" width="50" height="39" fill="#2E78B7"/><rect x="350" y="1" width="49" height="39" fill="#D5E6F2"/>
      <!-- B -->
      <rect x="1" y="40" width="49" height="40" fill="#EFF2F4"/><rect x="50" y="40" width="50" height="40" fill="#E7EBEE"/>
      <rect x="100" y="40" width="50" height="40" fill="#CBD2D8"/><rect x="150" y="40" width="50" height="40" fill="#6F7F8C"/>
      <rect x="200" y="40" width="50" height="40" fill="#BEC7CE"/><rect x="250" y="40" width="50" height="40" fill="#E4E9EC"/>
      <rect x="300" y="40" width="50" height="40" fill="#EEF1F3"/><rect x="350" y="40" width="49" height="40" fill="#F3F5F6"/>
      <!-- blank -->
      <rect x="1" y="80" width="49" height="39" fill="#5F6F7C"/><rect x="50" y="80" width="50" height="39" fill="#D6DDE2"/>
      <rect x="100" y="80" width="50" height="39" fill="#687885"/><rect x="150" y="80" width="50" height="39" fill="#D2DAE0"/>
      <rect x="200" y="80" width="50" height="39" fill="#667683"/><rect x="250" y="80" width="50" height="39" fill="#647481"/>
      <rect x="300" y="80" width="50" height="39" fill="#D4DCE1"/><rect x="350" y="80" width="49" height="39" fill="#637380"/>
    </g>
    <rect x="248" y="-5" width="108" height="130" rx="6" fill="none" stroke="#D48A00" stroke-width="3" stroke-dasharray="7 5"/>
    <text class="s" x="302" y="145" text-anchor="middle" fill="#B56E00">same A, second occurrence</text>
  </g>

  <rect x="72" y="302" width="174" height="48" rx="9" fill="#EAF3FA" stroke="#2E78B7" stroke-width="2"/>
  <text class="b" x="159" y="323" text-anchor="middle">Blank suppression</text>
  <text class="m" x="159" y="344" text-anchor="middle" font-size="17">log p<tspan baseline-shift="super" font-size="12">T</tspan>(∅) − δ</text>
  <path d="M251 326H280" class="blueflow"/>
  <rect x="287" y="302" width="171" height="48" rx="9" fill="#F5F7F9" stroke="#607180" stroke-width="2"/>
  <text class="b" x="372" y="323" text-anchor="middle">CTC FB</text>
  <text class="m" x="372" y="344" text-anchor="middle" font-size="17">γ<tspan baseline-shift="sub" font-size="12">t,u</tspan>(p̃<tspan baseline-shift="super" font-size="12">T</tspan>,Y)</text>
  <path d="M372 354V370" class="flow"/>
  <text class="m" x="28" y="398">a<tspan baseline-shift="super" font-size="13">T</tspan><tspan baseline-shift="sub" font-size="13">A₂,t</tspan></text>
  <g transform="translate(119,376)">
    <rect width="339" height="31" rx="6" fill="#F5F7F8" stroke="#7C8A96" stroke-width="1.5"/>
    <rect x="2" y="2" width="40" height="27" rx="4" fill="#F1F4F6"/><rect x="42" y="2" width="42" height="27" fill="#EDF2F5"/>
    <rect x="84" y="2" width="42" height="27" fill="#E9F0F4"/><rect x="126" y="2" width="42" height="27" fill="#E5EEF4"/>
    <rect x="168" y="2" width="42" height="27" fill="#D6E7F2"/><rect x="210" y="2" width="42" height="27" fill="#9CC5DE"/>
    <rect x="252" y="2" width="42" height="27" fill="#3E86BB"/><rect x="294" y="2" width="43" height="27" rx="4" fill="#B7D3E5"/>
  </g>

  <!-- 2. explicit weighted pooling -->
  <text class="h" x="548" y="34">2  Pool posterior over A₂</text>
  <text class="b" x="550" y="78">Teacher</text>
  <text class="b" x="550" y="242">Student</text>

  <!-- teacher weighted frame posteriors -->
  <g transform="translate(642,53)">
    <text class="m" x="-11" y="49" text-anchor="end">p<tspan baseline-shift="super" font-size="13">T</tspan><tspan baseline-shift="sub" font-size="13">t</tspan></text>
    <g stroke="#647380" stroke-width="1.4">
      <rect x="0" y="0" width="54" height="78" fill="#A9B4BC"/><rect x="0" y="70" width="54" height="8" fill="#2E78B7" stroke="none"/>
      <rect x="68" y="0" width="54" height="78" fill="#93A5B2"/><rect x="68" y="56" width="54" height="22" fill="#2E78B7" stroke="none"/>
      <rect x="136" y="0" width="54" height="78" fill="#5B99C8"/><rect x="136" y="13" width="54" height="65" fill="#2E78B7" stroke="none"/>
      <rect x="204" y="0" width="54" height="78" fill="#9DAAB4"/><rect x="204" y="63" width="54" height="15" fill="#2E78B7" stroke="none"/>
    </g>
    <text class="m" x="-11" y="111" text-anchor="end">a<tspan baseline-shift="super" font-size="13">T</tspan><tspan baseline-shift="sub" font-size="13">A₂,t</tspan></text>
    <g><rect x="0" y="91" width="54" height="24" fill="#E7F0F6"/><rect x="68" y="91" width="54" height="24" fill="#B8D4E5"/><rect x="136" y="91" width="54" height="24" fill="#3E86BB"/><rect x="204" y="91" width="54" height="24" fill="#AACDE1"/></g>
    <text class="n" x="129" y="141" text-anchor="middle">weighted frames</text>
  </g>
  <text class="h" x="919" y="111" text-anchor="middle">Σ</text>
  <path d="M905 119H930" class="flow"/>
  <g transform="translate(941,65)">
    <rect width="91" height="54" rx="8" fill="#A8B4BC" stroke="#566673" stroke-width="1.7"/>
    <rect x="0" y="24" width="91" height="30" rx="0" fill="#2E78B7"/>
    <text class="m" x="45" y="79" text-anchor="middle">q<tspan baseline-shift="super" font-size="13">T</tspan><tspan baseline-shift="sub" font-size="13">A₂</tspan>=Σ<tspan baseline-shift="sub" font-size="13">t</tspan>a<tspan baseline-shift="super" font-size="13">T</tspan><tspan baseline-shift="sub" font-size="13">t</tspan>p<tspan baseline-shift="super" font-size="13">T</tspan><tspan baseline-shift="sub" font-size="13">t</tspan></text>
  </g>

  <!-- student weighted frame posteriors, shifted spike -->
  <g transform="translate(642,217)">
    <text class="m" x="-11" y="49" text-anchor="end">p<tspan baseline-shift="super" font-size="13">S</tspan><tspan baseline-shift="sub" font-size="13">t</tspan></text>
    <g stroke="#647380" stroke-width="1.4">
      <rect x="0" y="0" width="54" height="78" fill="#A8B3BB"/><rect x="0" y="72" width="54" height="6" fill="#2E78B7" stroke="none"/>
      <rect x="68" y="0" width="54" height="78" fill="#9FACB5"/><rect x="68" y="64" width="54" height="14" fill="#2E78B7" stroke="none"/>
      <rect x="136" y="0" width="54" height="78" fill="#8FA3B1"/><rect x="136" y="52" width="54" height="26" fill="#2E78B7" stroke="none"/>
      <rect x="204" y="0" width="54" height="78" fill="#5797C5"/><rect x="204" y="14" width="54" height="64" fill="#2E78B7" stroke="none"/>
    </g>
    <text class="m" x="-11" y="111" text-anchor="end">a<tspan baseline-shift="super" font-size="13">S</tspan><tspan baseline-shift="sub" font-size="13">A₂,t</tspan></text>
    <g><rect x="0" y="91" width="54" height="24" fill="#E7F0F6"/><rect x="68" y="91" width="54" height="24" fill="#B8D4E5"/><rect x="136" y="91" width="54" height="24" fill="#3E86BB"/><rect x="204" y="91" width="54" height="24" fill="#AACDE1"/></g>
    <text class="n" x="129" y="141" text-anchor="middle">same A₂ support</text>
  </g>
  <text class="h" x="919" y="275" text-anchor="middle">Σ</text>
  <path d="M905 283H930" class="flow"/>
  <g transform="translate(941,229)">
    <rect width="91" height="54" rx="8" fill="#A5B2BA" stroke="#566673" stroke-width="1.7"/>
    <rect x="0" y="27" width="91" height="27" fill="#2E78B7"/>
    <text class="m" x="45" y="79" text-anchor="middle">q<tspan baseline-shift="super" font-size="13">S</tspan><tspan baseline-shift="sub" font-size="13">A₂</tspan>=Σ<tspan baseline-shift="sub" font-size="13">t</tspan>a<tspan baseline-shift="super" font-size="13">S</tspan><tspan baseline-shift="sub" font-size="13">t</tspan>p<tspan baseline-shift="super" font-size="13">S</tspan><tspan baseline-shift="sub" font-size="13">t</tspan></text>
  </g>
  <path d="M458 391H535V160H624" class="blueflow"/>
  <text class="n" x="531" y="379" text-anchor="end" fill="#2E78B7">A₂ support</text>
  <text class="n" x="795" y="401" text-anchor="middle" fill="#526270">teacher/student spikes may shift</text>

  <!-- 3. decoupled objectives -->
  <text class="h" x="1091" y="34">3  Decouple knowledge</text>
  <path d="M1036 92H1082V125" class="flow"/>
  <path d="M1036 256H1082V307" class="flow"/>

  <rect x="1092" y="68" width="338" height="142" rx="13" fill="#F3EFFA" stroke="#7559B8" stroke-width="2.4"/>
  <text class="h" x="1115" y="102" fill="#6749A9">BTKD</text>
  <g transform="translate(1115,119)">
    <rect width="292" height="40" rx="7" fill="#FFF" stroke="#687682" stroke-width="1.7"/>
    <path d="M6 2H60V38H6Q2 38 2 34V6Q2 2 6 2" fill="#8F9DA8"/>
    <rect x="60" y="2" width="176" height="36" fill="#4387BE"/>
    <path d="M236 2H286Q290 2 290 6V34Q290 38 286 38H236Z" fill="#E39A17"/>
    <text class="s" x="30" y="27" text-anchor="middle" fill="#FFF">∅</text>
    <text class="s" x="148" y="27" text-anchor="middle" fill="#FFF">A₂</text>
    <text class="s" x="263" y="27" text-anchor="middle">NT</text>
  </g>
  <text class="m" x="1261" y="191" text-anchor="middle">KL(m<tspan baseline-shift="super" font-size="13">T</tspan><tspan baseline-shift="sub" font-size="13">A₂</tspan> ∥ m<tspan baseline-shift="super" font-size="13">S</tspan><tspan baseline-shift="sub" font-size="13">A₂</tspan>)</text>

  <rect x="1092" y="230" width="338" height="146" rx="13" fill="#EBF7F1" stroke="#27815F" stroke-width="2.4"/>
  <text class="h" x="1115" y="264" fill="#1E7455">NTKD</text>
  <g transform="translate(1115,281)">
    <rect width="292" height="40" rx="7" fill="#FFF" stroke="#687682" stroke-width="1.7"/>
    <path d="M6 2H93V38H6Q2 38 2 34V6Q2 2 6 2" fill="#2E956E"/>
    <rect x="93" y="2" width="70" height="36" fill="#69B392"/><rect x="163" y="2" width="52" height="36" fill="#9BCDB5"/>
    <path d="M215 2H286Q290 2 290 6V34Q290 38 286 38H215Z" fill="#D1D9DE"/>
    <text class="s" x="47" y="27" text-anchor="middle" fill="#FFF">k₁</text><text class="s" x="128" y="27" text-anchor="middle">k₂</text>
    <text class="s" x="189" y="27" text-anchor="middle">…</text><text class="s" x="252" y="27" text-anchor="middle">tail</text>
  </g>
  <text class="m" x="1261" y="354" text-anchor="middle">KL(r̂<tspan baseline-shift="super" font-size="13">T</tspan><tspan baseline-shift="sub" font-size="13">A₂</tspan> ∥ r̂<tspan baseline-shift="super" font-size="13">S</tspan><tspan baseline-shift="sub" font-size="13">A₂</tspan>)</text>

  <path d="M1438 139H1461V206H1478" class="flow"/>
  <path d="M1438 303H1461V241H1478" class="flow"/>
  <rect x="1485" y="174" width="95" height="105" rx="11" fill="#F7F9FA" stroke="#5F6D78" stroke-width="2.2"/>
  <text class="b" x="1532" y="202" text-anchor="middle">AT-DKD</text>
  <text class="m" x="1532" y="230" text-anchor="middle" font-size="17">αL<tspan baseline-shift="sub" font-size="11">B</tspan>+βL<tspan baseline-shift="sub" font-size="11">N</tspan></text>
  <text class="m" x="1532" y="258" text-anchor="middle" font-size="17">+ L<tspan baseline-shift="sub" font-size="11">CTC</tspan></text>
  <text class="n" x="1261" y="411" text-anchor="middle"><tspan fill="#6749A9" font-weight="700">mass</tspan><tspan>  +  </tspan><tspan fill="#1E7455" font-weight="700">relations</tspan></text>
</svg>
