<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="410" viewBox="0 0 1600 410" role="img" aria-labelledby="title desc">
  <title id="title">AT-DKD method overview</title>
  <desc id="desc">Teacher-derived occurrence support pools both teacher and student raw posteriors before BTKD and NTKD.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#43515D"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2F78B7"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#D98200"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#202B33}
      .head{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}.body{font-size:17px}.small{font-size:14px}
      .math{font-family:'Times New Roman','Liberation Serif',serif;font-size:20px;font-style:italic}
      .box{fill:#FFF;stroke:#AEB9C2;stroke-width:2}.flow{fill:none;stroke:#43515D;stroke-width:2.7;marker-end:url(#arrow)}
      .blue{fill:none;stroke:#2F78B7;stroke-width:3;marker-end:url(#arrowBlue)}
      .orange{fill:none;stroke:#D98200;stroke-width:2.7;marker-end:url(#arrowOrange)}
    </style>
  </defs>
  <rect width="1600" height="410" fill="#FFF"/>

  <!-- SECTION 1: teacher occurrence -->
  <rect x="14" y="12" width="474" height="386" rx="15" fill="#FBFCFD" stroke="#D3D9DE" stroke-width="1.7"/>
  <text class="head" x="31" y="43">1  Teacher occurrence support</text>

  <!-- transcript -->
  <text class="body" x="31" y="77">Y</text>
  <g transform="translate(59,57)">
    <rect x="0" y="0" width="68" height="31" rx="7" fill="#E8F1F8" stroke="#2F78B7" stroke-width="1.5"/>
    <rect x="76" y="0" width="68" height="31" rx="7" fill="#F0F2F4" stroke="#778590" stroke-width="1.5"/>
    <rect x="152" y="0" width="68" height="31" rx="7" fill="#FFF1D5" stroke="#D98200" stroke-width="2.4"/>
    <text class="label" x="34" y="22" text-anchor="middle" fill="#2F78B7">A₁</text>
    <text class="label" x="110" y="22" text-anchor="middle">B</text>
    <text class="label" x="186" y="22" text-anchor="middle" fill="#B56A00">A₂</text>
  </g>
  <text class="small" x="294" y="78" fill="#B56A00">select u = 3</text>

  <!-- raw teacher posterior heatmap -->
  <text class="label" x="31" y="119">Raw teacher posterior</text>
  <text class="math" x="244" y="119">pᵀₜ</text>
  <g transform="translate(62,133)">
    <text class="body" x="-12" y="23" text-anchor="end" fill="#2F78B7">A</text>
    <text class="body" x="-12" y="53" text-anchor="end">B</text>
    <text class="body" x="-12" y="83" text-anchor="end">∅</text>
    <rect width="392" height="90" rx="6" fill="#F6F8F9" stroke="#8796A2" stroke-width="1.5"/>
    <g stroke="#FFF" stroke-width="2">
      <rect x="1" y="1" width="49" height="29" fill="#DFECF5"/><rect x="50" y="1" width="49" height="29" fill="#347FBA"/>
      <rect x="99" y="1" width="49" height="29" fill="#DCEAF4"/><rect x="148" y="1" width="49" height="29" fill="#EEF4F8"/>
      <rect x="197" y="1" width="49" height="29" fill="#E8F1F7"/><rect x="246" y="1" width="49" height="29" fill="#BBD6E8"/>
      <rect x="295" y="1" width="49" height="29" fill="#347FBA"/><rect x="344" y="1" width="47" height="29" fill="#D8E7F2"/>
      <rect x="1" y="30" width="49" height="30" fill="#F0F2F4"/><rect x="50" y="30" width="49" height="30" fill="#E7EBEE"/>
      <rect x="99" y="30" width="49" height="30" fill="#C6CFD6"/><rect x="148" y="30" width="49" height="30" fill="#6D7D89"/>
      <rect x="197" y="30" width="49" height="30" fill="#C3CCD3"/><rect x="246" y="30" width="49" height="30" fill="#E4E8EB"/>
      <rect x="295" y="30" width="49" height="30" fill="#EEF1F3"/><rect x="344" y="30" width="47" height="30" fill="#F2F4F5"/>
      <rect x="1" y="60" width="49" height="29" fill="#657582"/><rect x="50" y="60" width="49" height="29" fill="#D0D8DE"/>
      <rect x="99" y="60" width="49" height="29" fill="#687885"/><rect x="148" y="60" width="49" height="29" fill="#D5DCE1"/>
      <rect x="197" y="60" width="49" height="29" fill="#687885"/><rect x="246" y="60" width="49" height="29" fill="#647481"/>
      <rect x="295" y="60" width="49" height="29" fill="#D2DAE0"/><rect x="344" y="60" width="47" height="29" fill="#657582"/>
    </g>
    <rect x="242" y="-4" width="106" height="98" rx="5" fill="none" stroke="#D98200" stroke-width="2.5" stroke-dasharray="6 4"/>
  </g>

  <!-- support extraction -->
  <path d="M258 229V248" class="blue"/>
  <rect x="85" y="253" width="338" height="44" rx="9" fill="#EAF3FA" stroke="#2F78B7" stroke-width="2"/>
  <text class="label" x="254" y="281" text-anchor="middle">blank suppression  →  CTC forward–backward</text>
  <path d="M254 299V316" class="blue"/>

  <!-- occurrence matrix: visibly separates A1 and A2 -->
  <g transform="translate(62,323)">
    <text class="small" x="-10" y="13" text-anchor="end">A₁</text>
    <text class="small" x="-10" y="32" text-anchor="end">B</text>
    <text class="small" x="-10" y="51" text-anchor="end" fill="#B56A00" font-weight="700">A₂</text>
    <rect width="392" height="57" rx="5" fill="#F5F7F8" stroke="#8796A2" stroke-width="1.4"/>
    <!-- A1 -->
    <rect x="1" y="1" width="49" height="18" fill="#BBD5E7"/><rect x="50" y="1" width="49" height="18" fill="#3B83BA"/><rect x="99" y="1" width="49" height="18" fill="#AACBE0"/>
    <!-- B -->
    <rect x="99" y="20" width="49" height="18" fill="#D2D9DE"/><rect x="148" y="20" width="49" height="18" fill="#7B8994"/><rect x="197" y="20" width="49" height="18" fill="#C1CAD1"/>
    <!-- A2 -->
    <rect x="197" y="39" width="49" height="17" fill="#D8E8F2"/><rect x="246" y="39" width="49" height="17" fill="#A2C8DF"/><rect x="295" y="39" width="49" height="17" fill="#347FBA"/><rect x="344" y="39" width="47" height="17" fill="#BBD6E7"/>
    <rect x="193" y="36" width="198" height="21" rx="4" fill="none" stroke="#D98200" stroke-width="2.2"/>
  </g>
  <text class="math" x="258" y="397" text-anchor="middle">γᵀ(A₂,t)</text>

  <!-- raw WHAT bypass -->
  <path d="M459 180H504V79H553" class="orange"/>
  <text class="small" x="502" y="67" text-anchor="middle" fill="#B56A00">raw pᵀ</text>

  <!-- SECTION 2: shared teacher support -->
  <rect x="512" y="12" width="541" height="386" rx="15" fill="#FBFCFD" stroke="#D3D9DE" stroke-width="1.7"/>
  <text class="head" x="532" y="43">2  Pool with teacher-derived support</text>

  <!-- teacher pool -->
  <text class="label" x="539" y="91">Teacher</text>
  <g transform="translate(619,61)">
    <text class="math" x="-10" y="48" text-anchor="end">pᵀₜ</text>
    <g stroke="#61717D" stroke-width="1.3">
      <rect x="0" y="0" width="42" height="65" fill="#ABB5BD"/><rect x="0" y="58" width="42" height="7" fill="#347FBA" stroke="none"/>
      <rect x="51" y="0" width="42" height="65" fill="#9BA9B3"/><rect x="51" y="49" width="42" height="16" fill="#347FBA" stroke="none"/>
      <rect x="102" y="0" width="42" height="65" fill="#6B9FC7"/><rect x="102" y="16" width="42" height="49" fill="#347FBA" stroke="none"/>
      <rect x="153" y="0" width="42" height="65" fill="#A1ADB6"/><rect x="153" y="55" width="42" height="10" fill="#347FBA" stroke="none"/>
    </g>
    <text class="math" x="-10" y="91" text-anchor="end">aᵀ</text>
    <rect x="0" y="73" width="42" height="21" fill="#DFECF5"/><rect x="51" y="73" width="42" height="21" fill="#A9CCE1"/><rect x="102" y="73" width="42" height="21" fill="#3A82B9"/><rect x="153" y="73" width="42" height="21" fill="#B8D4E5"/>
  </g>
  <text class="head" x="842" y="111" text-anchor="middle">Σₜ</text>
  <path d="M817 117H852" class="flow"/>
  <g transform="translate(868,73)">
    <rect width="98" height="55" rx="8" fill="#AAB5BD" stroke="#586874" stroke-width="1.7"/>
    <rect x="0" y="25" width="98" height="30" fill="#347FBA"/>
    <text class="math" x="49" y="80" text-anchor="middle">qᵀ_A₂</text>
  </g>

  <!-- one support, resampled -->
  <path d="M735 164V201" class="blue"/>
  <rect x="666" y="171" width="139" height="29" rx="14" fill="#EAF3FA" stroke="#2F78B7" stroke-width="1.8"/>
  <text class="body" x="735" y="191" text-anchor="middle" fill="#2F78B7">resample aᵀ</text>

  <!-- student pool -->
  <text class="label" x="539" y="245">Student</text>
  <g transform="translate(619,218)">
    <text class="math" x="-10" y="48" text-anchor="end">pˢₜ</text>
    <g stroke="#61717D" stroke-width="1.3">
      <rect x="0" y="0" width="50" height="65" fill="#AAB5BD"/><rect x="0" y="59" width="50" height="6" fill="#347FBA" stroke="none"/>
      <rect x="61" y="0" width="50" height="65" fill="#A0ADB6"/><rect x="61" y="52" width="50" height="13" fill="#347FBA" stroke="none"/>
      <rect x="122" y="0" width="50" height="65" fill="#6C9FC6"/><rect x="122" y="23" width="50" height="42" fill="#347FBA" stroke="none"/>
    </g>
    <text class="math" x="-10" y="91" text-anchor="end">R(aᵀ)</text>
    <rect x="0" y="73" width="50" height="21" fill="#DCEAF4"/><rect x="61" y="73" width="50" height="21" fill="#82B2D0"/><rect x="122" y="73" width="50" height="21" fill="#4388BC"/>
  </g>
  <text class="head" x="842" y="268" text-anchor="middle">Σₜ</text>
  <path d="M817 274H852" class="flow"/>
  <g transform="translate(868,230)">
    <rect width="98" height="55" rx="8" fill="#A6B2BA" stroke="#586874" stroke-width="1.7"/>
    <rect x="0" y="29" width="98" height="26" fill="#347FBA"/>
    <text class="math" x="49" y="80" text-anchor="middle">qˢ_A₂</text>
  </g>

  <!-- explicit equations, only two -->
  <text class="math" x="780" y="349" text-anchor="middle">qᵀ_A₂ = Σₜ aᵀ_A₂,t pᵀₜ</text>
  <text class="math" x="780" y="379" text-anchor="middle">qˢ_A₂ = Σₜ R(aᵀ_A₂)_t pˢₜ</text>

  <!-- selected support to center -->
  <path d="M455 352H500V187H606" class="blue"/>

  <!-- SECTION 3: decoupled KD -->
  <rect x="1077" y="12" width="509" height="386" rx="15" fill="#FBFCFD" stroke="#D3D9DE" stroke-width="1.7"/>
  <text class="head" x="1097" y="43">3  Decouple pooled knowledge</text>
  <path d="M969 100H1070V126" class="flow"/>
  <path d="M969 257H1070V291" class="flow"/>

  <!-- BTKD -->
  <rect x="1098" y="70" width="332" height="132" rx="12" fill="#F2EEFA" stroke="#7257B3" stroke-width="2.2"/>
  <text class="head" x="1118" y="103" fill="#6547A5">BTKD</text>
  <text class="body" x="1213" y="101">mass</text>
  <g transform="translate(1120,118)">
    <rect width="287" height="38" rx="6" fill="#FFF" stroke="#657480" stroke-width="1.5"/>
    <path d="M5 2H55V36H5Q2 36 2 33V5Q2 2 5 2" fill="#929FA9"/>
    <rect x="55" y="2" width="172" height="34" fill="#4388BE"/>
    <path d="M227 2H282Q285 2 285 5V33Q285 36 282 36H227Z" fill="#E19A20"/>
    <text class="small" x="28" y="25" text-anchor="middle" fill="#FFF">∅</text>
    <text class="small" x="141" y="25" text-anchor="middle" fill="#FFF">A₂</text>
    <text class="small" x="256" y="25" text-anchor="middle">NT</text>
  </g>
  <text class="math" x="1264" y="185" text-anchor="middle">KL(mᵀ_A₂ ∥ mˢ_A₂)</text>

  <!-- NTKD -->
  <rect x="1098" y="221" width="332" height="137" rx="12" fill="#EAF7F1" stroke="#247C5B" stroke-width="2.2"/>
  <text class="head" x="1118" y="254" fill="#1C704F">NTKD</text>
  <text class="body" x="1213" y="252">relations</text>
  <g transform="translate(1120,269)">
    <rect width="287" height="38" rx="6" fill="#FFF" stroke="#657480" stroke-width="1.5"/>
    <path d="M5 2H88V36H5Q2 36 2 33V5Q2 2 5 2" fill="#2F956E"/>
    <rect x="88" y="2" width="67" height="34" fill="#6BB494"/><rect x="155" y="2" width="51" height="34" fill="#9DCEB7"/>
    <path d="M206 2H282Q285 2 285 5V33Q285 36 282 36H206Z" fill="#D0D8DD"/>
    <text class="small" x="45" y="25" text-anchor="middle" fill="#FFF">k₁</text><text class="small" x="121" y="25" text-anchor="middle">k₂</text>
    <text class="small" x="180" y="25" text-anchor="middle">…</text><text class="small" x="246" y="25" text-anchor="middle">tail</text>
  </g>
  <text class="math" x="1264" y="339" text-anchor="middle">KL(r̂ᵀ_A₂ ∥ r̂ˢ_A₂)</text>

  <!-- final objective -->
  <path d="M1438 137H1463V207" class="flow"/>
  <path d="M1438 289H1463V245" class="flow"/>
  <rect x="1471" y="183" width="96" height="88" rx="10" fill="#FFF" stroke="#586773" stroke-width="2"/>
  <text class="label" x="1519" y="210" text-anchor="middle">AT-DKD</text>
  <text class="math" x="1519" y="238" text-anchor="middle" font-size="16">αL_B + βL_N</text>
  <text class="math" x="1519" y="260" text-anchor="middle" font-size="16">+ L_CTC</text>
</svg>
