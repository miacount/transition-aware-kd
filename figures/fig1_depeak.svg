  <!-- caption -->
  <text x="40" y="382" font-size="10" fill="#475569" font-style="italic">Fig. 1 (steps &#9312;&#8211;&#9313;). Blank-only de-peaking: subtract &#948; = 6 nats from the blank log-probability at every frame, then renormalize per frame.</text>
  <text x="40" y="398" font-size="10" fill="#475569" font-style="italic">Only shoulder frames flip (f3: 19:1 &#8594; 0.05:1), widening each token&#8217;s support to &#8776; 2 frames; true silence keeps blank (f1). Non-blank ratios are untouched.</text>
  <text x="40" y="414" font-size="10" fill="#475569" font-style="italic">P&#771;&#7488; is used only to extract the alignment (step &#9314;); distillation content later comes from the original P&#7488;.</text>
